name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # manual test runs (build only, no release)

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-13          # Intel — runs on Apple Silicon via Rosetta too
            platform: macos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libsndfile1 libgl1 libegl1 libglib2.0-0

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          pip install pyinstaller pillow

      # ---- bundle ffmpeg + ffprobe so the app runs without a system install ----
      - name: Stage ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar xf ffmpeg-release-amd64-static.tar.xz
          mkdir -p packaging/bin
          cp ffmpeg-*-amd64-static/ffmpeg ffmpeg-*-amd64-static/ffprobe packaging/bin/
          chmod +x packaging/bin/*

      - name: Stage ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $u = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $u -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ffdir
          New-Item -ItemType Directory -Force packaging/bin | Out-Null
          Get-ChildItem -Recurse ffdir -Include ffmpeg.exe,ffprobe.exe | ForEach-Object { Copy-Item $_.FullName packaging/bin/ }

      - name: Stage ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p packaging/bin
          for b in ffmpeg ffprobe; do
            curl -sL "https://evermeet.cx/ffmpeg/getrelease/$b/zip" -o "$b.zip"
            unzip -o "$b.zip" -d packaging/bin
          done
          chmod +x packaging/bin/*

      # ---- platform icon ----
      - name: Icon (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('assets/icon.png').save('packaging/icon.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"
          "CRAZYGLITCH_ICON=packaging/icon.ico" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Icon (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p icon.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s assets/icon.png --out "icon.iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s*2)); sips -z $d $d assets/icon.png --out "icon.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o packaging/icon.icns
          echo "CRAZYGLITCH_ICON=packaging/icon.icns" >> "$GITHUB_ENV"

      - name: Build (PyInstaller)
        run: pyinstaller --noconfirm packaging/crazyglitch.spec

      # ---- package per platform ----
      - name: Package AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x packaging/build-appimage.sh
          packaging/build-appimage.sh CrazyVideoGlitchEditor-linux-x86_64.AppImage

      - name: Package zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/CrazyVideoGlitchEditor -DestinationPath CrazyVideoGlitchEditor-windows-x64.zip

      - name: Package zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/CrazyVideoGlitchEditor.app CrazyVideoGlitchEditor-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            CrazyVideoGlitchEditor-*.AppImage
            CrazyVideoGlitchEditor-*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -lR artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
